  - {id: GBPUSD,  name: GBP/USD,             cat: Monedas, src: yahoo, code: "GBPUSD=X", unit: USD, dec: 4}
  - {id: USDJPY,  name: USD/JPY,             cat: Monedas, src: yahoo, code: "JPY=X",    unit: JPY}
  - {id: USDCNY,  name: USD/CNY,             cat: Monedas, src: yahoo, code: "CNY=X",    unit: CNY, dec: 4}
  - {id: USDBRL,  name: USD/BRL,             cat: Monedas, src: yahoo, code: "BRL=X",    unit: BRL, dec: 4}
  - {id: USDMXN,  name: USD/MXN,             cat: Monedas, src: yahoo, code: "MXN=X",    unit: MXN, dec: 4}
  - {id: USDCLP,  name: USD/CLP (mercado),   cat: Monedas, src: yahoo, code: "CLP=X",    unit: CLP}

  # ---------------- Materias primas ----------------
