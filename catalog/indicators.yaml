  - {id: IGOAS,   name: Spread Grado Inv. (OAS),  cat: Crédito, src: fred, code: BAMLC0A0CM,   unit: "%"}
  - {id: NFCI,    name: Cond. financieras (NFCI), cat: Crédito, src: fred, code: NFCI,         unit: idx, dec: 3}

  # ---------------- Macro EE.UU. (FRED) ----------------
