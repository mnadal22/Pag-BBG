# Catálogo de indicadores.
# Para agregar uno: añade una entrada y haz push. El workflow lo bajará solo.
#
# Campos de "series":
#   id    : identificador corto, único (se usa en la barra de comandos y en los archivos)
#   name  : nombre visible
#   cat   : categoría (agrupa en la interfaz)
#   src   : fred | bcch | yahoo
#   code  : código en la fuente (FRED series_id, código BDE del BCCh, ticker de Yahoo)
#   unit  : unidad. Si es "%" o "pb", las variaciones se muestran en diferencia absoluta;
#           si no, en % de variación.
#   dec   : decimales a mostrar (opcional, por defecto 2)
#
# Campos de "derived" (se calculan a partir de otros ids, incluso de otros derivados):
#   op    : spread (a - b) | ratio (a / b) | yoy (variación % a 12 meses de a)
#   args  : [a, b] o [a]
#   scale : multiplicador opcional (p. ej. 100 para pasar de % a pb)

defaults:
  start: "2000-01-01"

series:
  # ---------------- Renta variable ----------------
  - {id: SPX,     name: S&P 500,             cat: Renta variable, src: yahoo, code: "^GSPC",     unit: pts}
  - {id: NDX,     name: Nasdaq 100,          cat: Renta variable, src: yahoo, code: "^NDX",      unit: pts}
  - {id: INDU,    name: Dow Jones,           cat: Renta variable, src: yahoo, code: "^DJI",      unit: pts}
  - {id: RTY,     name: Russell 2000,        cat: Renta variable, src: yahoo, code: "^RUT",      unit: pts}
  - {id: SX5E,    name: Euro Stoxx 50,       cat: Renta variable, src: yahoo, code: "^STOXX50E", unit: pts}
  - {id: DAX,     name: DAX,                 cat: Renta variable, src: yahoo, code: "^GDAXI",    unit: pts}
  - {id: UKX,     name: FTSE 100,            cat: Renta variable, src: yahoo, code: "^FTSE",     unit: pts}
  - {id: NKY,     name: Nikkei 225,          cat: Renta variable, src: yahoo, code: "^N225",     unit: pts}
  - {id: HSI,     name: Hang Seng,           cat: Renta variable, src: yahoo, code: "^HSI",      unit: pts}
  - {id: SHCOMP,  name: Shanghai Composite,  cat: Renta variable, src: yahoo, code: "000001.SS", unit: pts}
  - {id: IBOV,    name: Bovespa,             cat: Renta variable, src: yahoo, code: "^BVSP",     unit: pts}
  - {id: MEXBOL,  name: IPC México,          cat: Renta variable, src: yahoo, code: "^MXX",      unit: pts}
  - {id: IPSA,    name: S&P IPSA,            cat: Renta variable, src: yahoo, code: "^IPSA",     unit: pts}
  - {id: EEM,     name: MSCI EM (ETF EEM),   cat: Renta variable, src: yahoo, code: "EEM",       unit: USD}
  - {id: VIX,     name: VIX,                 cat: Volatilidad,    src: yahoo, code: "^VIX",      unit: pts}
  - {id: MOVE,    name: MOVE (vol. bonos),   cat: Volatilidad,    src: yahoo, code: "^MOVE",     unit: pts}

  # ---------------- Monedas ----------------
