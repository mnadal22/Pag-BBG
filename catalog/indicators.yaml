  - {id: CO,      name: Petróleo Brent,      cat: Materias primas, src: yahoo, code: "BZ=F", unit: USD/bbl}
  - {id: NG,      name: Gas natural,         cat: Materias primas, src: yahoo, code: "NG=F", unit: USD/MMBtu, dec: 3}

  # ---------------- Cripto ----------------
