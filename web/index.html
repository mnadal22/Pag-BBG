<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal · Monitor</title>
<style>
  :root{
    --bg:#000; --panel:#0a0a0a; --line:#262626; --text:#e6e6e6; --dim:#8a8a8a;
    --amber:#ffa028; --up:#20c95a; --down:#ff4040; --sel:#1a1306;
    --font:"IBM Plex Mono","JetBrains Mono",Consolas,monospace; --fs:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.35 var(--font)}
  header{display:flex;gap:12px;align-items:center;padding:6px 10px;background:var(--amber);color:#000;font-weight:700}
  header input{flex:1;max-width:420px;background:#000;color:var(--amber);border:0;padding:4px 8px;font:inherit;text-transform:uppercase}
  header .meta{margin-left:auto;font-weight:400}
  main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1px;background:var(--line);height:calc(100vh - 34px)}
  section{background:var(--panel);overflow:auto}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:#141414;color:var(--amber);text-align:right;padding:3px 6px;font-weight:600;border-bottom:1px solid var(--line)}
  th:first-child,th:nth-child(2),td:first-child,td:nth-child(2){text-align:left}
  td{padding:2px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid #111}
  tr.cat td{color:var(--amber);background:#0f0b04;font-weight:700;padding-top:6px}
  tr.row{cursor:pointer} tr.row:hover td{background:#111} tr.row.sel td{background:var(--sel)}
  td.id{color:var(--amber)} .up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)}
  #chart{padding:10px}
  #chart h2{margin:0 0 4px;color:var(--amber);font-size:14px}
  .btns button{background:#141414;color:var(--text);border:1px solid var(--line);font:inherit;padding:2px 8px;cursor:pointer}
  .btns button.on{background:var(--amber);color:#000}
  svg text{fill:var(--dim);font:10px var(--font)}
  .stats{line-height:1.7;margin-top:4px}
  .studies button.on{background:#5a8dee;color:#000}
  @media (max-width:900px){main{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<header>
  <span>MONITOR</span>
  <input id="cmd" placeholder="Buscar: SPX, cobre, UST…  (Enter abre el gráfico)" autocomplete="off">
  <span class="meta" id="meta">cargando…</span>
</header>
<main>
  <section><table id="tbl"><thead><tr>
    <th>ID</th><th>Indicador</th><th>Último</th><th>Δ ant.</th><th>1S</th><th>1M</th><th>YTD</th><th>1A</th><th>z 1A</th><th>Fecha</th>
  </tr></thead><tbody></tbody></table></section>
  <section id="chart"><h2>Selecciona un indicador</h2></section>
</main>
<script>
const $ = s => document.querySelector(s);
let CAT = {}, ROWS = [], SEL = null, RANGE = "1A";
const fmt = (v, d=2) => v==null ? "—" : v.toLocaleString("es-CL",{minimumFractionDigits:d,maximumFractionDigits:d});
const chg = (v, kind) => {
  if (v==null) return '<span class="dim">—</span>';
  const cls = v>0 ? "up" : v<0 ? "down" : "dim";
  const txt = kind==="abs" ? (v>0?"+":"")+fmt(v, 2) : (v>0?"+":"")+fmt(v,2)+"%";
  return `<span class="${cls}">${txt}</span>`;
};

async function load(){
  const [c, s] = await Promise.all([fetch("data/catalog.json").then(r=>r.json()), fetch("data/snapshot.json").then(r=>r.json())]);
  c.indicators.forEach(i => CAT[i.id] = i);
  const catOrder = [...new Set(c.indicators.map(i => i.cat))];
  const pos = Object.fromEntries(c.indicators.map((i, k) => [i.id, k]));
  ROWS = s.rows.map(r => ({...CAT[r.id], ...r, lastDate: CAT[r.id].last}))
    .sort((a, b) => catOrder.indexOf(a.cat) - catOrder.indexOf(b.cat) || pos[a.id] - pos[b.id]);
  const bad = c.indicators.filter(i => i.status !== "ok").length;
  $("#meta").textContent = `${ROWS.length} indicadores · actualizado ${new Date(s.generated).toLocaleString("es-CL")}` + (bad?` · ${bad} con aviso`:"");
  render();
}

function render(q=""){
  q = q.trim().toLowerCase();
  const rows = ROWS.filter(r => !q || r.id.toLowerCase().includes(q) || r.name.toLowerCase().includes(q) || r.cat.toLowerCase().includes(q));
  let html = "", cat = null;
  for (const r of rows){
    if (r.cat !== cat){ cat = r.cat; html += `<tr class="cat"><td colspan="10">${cat}</td></tr>`; }
    html += `<tr class="row${r.id===SEL?" sel":""}" data-id="${r.id}">
      <td class="id">${r.id}</td><td>${r.name} <span class="dim">${r.unit||""}</span>${r.status!=="ok"?' <span class="down" title="'+r.status+'">●</span>':""}</td>
      <td>${fmt(r.last, r.dec)}</td><td>${chg(r.d1,r.chg_kind)}</td><td>${chg(r.w1,r.chg_kind)}</td><td>${chg(r.m1,r.chg_kind)}</td>
      <td>${chg(r.ytd,r.chg_kind)}</td><td>${chg(r.y1,r.chg_kind)}</td><td>${fmt(r.z1y,1)}</td><td class="dim">${r.date}</td></tr>`;
  }
  $("#tbl tbody").innerHTML = html;
  return rows;
}

const RANGES = {"1M":1/12,"3M":.25,"6M":.5,"YTD":"ytd","1A":1,"3A":3,"5A":5,"10A":10,"MAX":99};
// Estudios superpuestos (se recuerdan entre gráficos)
const STUDIES = {mu:["Media",true], s1:["±1σ",true], s2:["±2σ",true], s3:["±3σ",false], ma50:["MM50",false], ma200:["MM200",false], reg:["Tendencia",false]};
const ON = Object.fromEntries(Object.entries(STUDIES).map(([k,v])=>[k,v[1]]));
let CACHE = {};
function movAvg(vals, n){ const out=[]; let s=0; for(let i=0;i<vals.length;i++){ s+=vals[i]; if(i>=n) s-=vals[i-n]; out.push(i>=n-1? s/n : null);} return out; }

async function chart(id){
  SEL = id; render($("#cmd").value);
  const m = CAT[id];
  const j = CACHE[id] || (CACHE[id] = await fetch(`data/series/${id}.json`).then(r=>r.json()));
  const all = j.d.map((d,i)=>[new Date(d), j.v[i]]).filter(p => p[1]!=null);
  const lastD = all[all.length-1][0];
  let cut;
  if (RANGES[RANGE]==="ytd") cut = new Date(lastD.getFullYear(),0,1);
  else { cut = new Date(lastD); cut.setDate(cut.getDate() - RANGES[RANGE]*365); }
  const i0 = Math.max(0, all.findIndex(p => p[0] >= cut));
  const pts = all.slice(i0);
  const ys = pts.map(p=>p[1]), n = ys.length;
  // estadísticas del plazo visible
  const mu = ys.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(ys.reduce((a,b)=>a+(b-mu)**2,0)/Math.max(1,n-1));
  const last = ys[n-1], z = sd? (last-mu)/sd : 0;
  const ret = m.unit==="%"||m.unit==="pb" ? last-ys[0] : (last/ys[0]-1)*100;
  // medias móviles sobre toda la historia, recortadas al plazo
  const allV = all.map(p=>p[1]);
  const ma = k => movAvg(allV,k).slice(i0);
  // regresión lineal en el plazo
  const xsI = ys.map((_,i)=>i), xm=(n-1)/2;
  const beta = xsI.reduce((a,x,i)=>a+(x-xm)*(ys[i]-mu),0)/Math.max(1,xsI.reduce((a,x)=>a+(x-xm)**2,0));
  const lines = [];
  if (ON.mu) lines.push({v:mu, c:"var(--amber)", d:"", t:"μ"});
  [1,2,3].forEach(k=>{ if (ON["s"+k]) { lines.push({v:mu+k*sd, c:"#5a8dee", d:"4 3", t:`+${k}σ`}); lines.push({v:mu-k*sd, c:"#5a8dee", d:"4 3", t:`−${k}σ`}); }});
  const series = [];
  if (ON.ma50) series.push({v:ma(50), c:"#c792ea"});
  if (ON.ma200) series.push({v:ma(200), c:"#4ec9b0"});
  if (ON.reg) series.push({v:ys.map((_,i)=>mu+beta*(i-xm)), c:"#aaa", d:"2 3"});

  const W=640,H=340,P=56,R=40;
  const ext = [...ys, ...lines.map(l=>l.v), ...series.flatMap(s=>s.v.filter(v=>v!=null))];
  let y0=Math.min(...ext), y1=Math.max(...ext); const pad=(y1-y0)*.04||1; y0-=pad; y1+=pad;
  const x0=+pts[0][0], x1=+pts[n-1][0];
  const X=t=>P+(t-x0)/(x1-x0||1)*(W-P-R), Y=v=>H-22-(v-y0)/(y1-y0)*(H-40);
  const pathOf = vals => { let d="",pen=false; vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?"L":"M")+X(+pts[i][0]).toFixed(1)+","+Y(v).toFixed(1); pen=true;}); return d; };
  const grid = [0,.25,.5,.75,1].map(f=>{const v=y0+(y1-y0)*f;return `<line x1="${P}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1c1c1c"/><text x="4" y="${Y(v)+3}">${fmt(v,m.dec)}</text>`}).join("");
  const band = ON.s1 ? `<rect x="${P}" width="${W-P-R}" y="${Y(mu+sd)}" height="${Math.max(0,Y(mu-sd)-Y(mu+sd))}" fill="#5a8dee" opacity=".07"/>` : "";
  const hl = lines.map(l=>`<line x1="${P}" x2="${W-R}" y1="${Y(l.v)}" y2="${Y(l.v)}" stroke="${l.c}" stroke-dasharray="${l.d}" stroke-width="1"/><text x="${W-R+3}" y="${Y(l.v)+3}" style="fill:${l.c}">${l.t}</text>`).join("");
  const ov = series.map(s=>`<path d="${pathOf(s.v)}" fill="none" stroke="${s.c}" stroke-width="1.1" ${s.d?`stroke-dasharray="${s.d}"`:""}/>`).join("");
  const up = last >= ys[0];
  const stat = (k,v,cls="") => `<span class="dim">${k}</span> <span class="${cls}">${v}</span>`;
  $("#chart").innerHTML = `<h2>${id} · ${m.name}</h2>
    <div class="dim">${m.src}${m.code?":"+m.code:""} · ${m.unit||""} · ${n} obs · último ${pts[n-1][0].toISOString().slice(0,10)}</div>
    <div class="btns" style="margin:8px 0 4px">${Object.keys(RANGES).map(r=>`<button class="${r===RANGE?"on":""}" data-r="${r}">${r}</button>`).join("")}</div>
    <div class="btns studies" style="margin:0 0 6px">${Object.entries(STUDIES).map(([k,v])=>`<button class="${ON[k]?"on":""}" data-s="${k}">${v[0]}</button>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" id="svg">${grid}${band}${hl}${ov}
      <path d="${pathOf(ys)}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="1.5"/>
      <line id="xh" y1="10" y2="${H-22}" stroke="#555" visibility="hidden"/><circle id="xd" r="3" fill="var(--amber)" visibility="hidden"/>
      <text x="${P}" y="${H-6}">${pts[0][0].toISOString().slice(0,10)}</text>
      <text x="${W-R}" y="${H-6}" text-anchor="end">${pts[n-1][0].toISOString().slice(0,10)}</text></svg>
    <div id="hover" class="dim" style="min-height:1.4em"></div>
    <div class="stats">
      ${stat("Último", fmt(last,m.dec))} · ${stat("Var. plazo", (ret>0?"+":"")+fmt(ret,2)+(m.unit==="%"||m.unit==="pb"?"":"%"), ret>=0?"up":"down")}<br>
      ${stat("Media", fmt(mu,m.dec))} · ${stat("σ", fmt(sd,m.dec))} · ${stat("z", fmt(z,2), Math.abs(z)>=2?"down":"")}<br>
      ${stat("Mín", fmt(Math.min(...ys),m.dec))} · ${stat("Máx", fmt(Math.max(...ys),m.dec))} · ${stat("±2σ", fmt(mu-2*sd,m.dec)+" / "+fmt(mu+2*sd,m.dec))}
    </div>`;
  document.querySelectorAll(".btns button[data-r]").forEach(b => b.onclick = () => { RANGE = b.dataset.r; chart(id); });
  document.querySelectorAll(".btns button[data-s]").forEach(b => b.onclick = () => { ON[b.dataset.s] = !ON[b.dataset.s]; chart(id); });
  // cursor
  const svg = $("#svg");
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width;
    const t = x0 + (x - P) / (W - P - R) * (x1 - x0);
    let k = 0, best = Infinity; pts.forEach((p,i)=>{ const dd=Math.abs(+p[0]-t); if(dd<best){best=dd;k=i;} });
    const px = X(+pts[k][0]), py = Y(ys[k]);
    $("#xh").setAttribute("x1",px); $("#xh").setAttribute("x2",px); $("#xh").setAttribute("visibility","visible");
    $("#xd").setAttribute("cx",px); $("#xd").setAttribute("cy",py); $("#xd").setAttribute("visibility","visible");
    $("#hover").innerHTML = `${pts[k][0].toISOString().slice(0,10)} · <span style="color:var(--text)">${fmt(ys[k],m.dec)}</span> · z ${fmt(sd?(ys[k]-mu)/sd:0,2)}`;
  };
  svg.onmouseleave = () => { $("#xh").setAttribute("visibility","hidden"); $("#xd").setAttribute("visibility","hidden"); };
}

$("#tbl").addEventListener("click", e => { const tr = e.target.closest("tr.row"); if (tr) chart(tr.dataset.id); });
$("#cmd").addEventListener("input", e => render(e.target.value));
$("#cmd").addEventListener("keydown", e => {
  if (e.key === "Enter"){ const rows = render(e.target.value); if (rows.length) chart(rows[0].id); }
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#cmd")){ e.preventDefault(); $("#cmd").focus(); } });
load().catch(err => $("#meta").textContent = "Error cargando datos: " + err);
</script>
</body>
</html>
