name: Actualizar datos y publicar

on:
  schedule:
    # Horas en UTC. Chile (verano) = UTC-3.
    - cron: "30 21 * * 1-5"   # 18:30 Chile, después del cierre de EE.UU.
    - cron: "0 12 * * *"      # 09:00 Chile, datos macro de la mañana (y cripto el fin de semana)
  workflow_dispatch: {}        # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["catalog/**", "ingest/**", "web/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar indicadores
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
          FALLBACK_BASE_URL: ${{ vars.SITE_URL }}
        run: python -m ingest.run --catalog catalog/indicators.yaml --out site/data

      - name: Copiar la interfaz
        run: cp -r web/. site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
