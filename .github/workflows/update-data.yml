name: Actualizar datos y publicar

on:
  schedule:
    # Horas en UTC. Chile (verano) = UTC-3.
    - cron: "*/15 12-21 * * 1-5"  # cada 15 min, 09:00–18:45 Chile, días hábiles (mercados abiertos)
    - cron: "30 22 * * 1-5"       # 19:30 Chile, cierre definitivo de EE.UU.
    - cron: "0 */4 * * 0,6"       # fin de semana cada 4 h (cripto)
    # Nota: GitHub puede atrasar los cron programados algunos minutos en horas de alta carga.
  workflow_dispatch: {}        # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["catalog/**", "ingest/**", "web/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar indicadores
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
          FALLBACK_BASE_URL: ${{ vars.SITE_URL }}
        run: python -m ingest.run --catalog catalog/indicators.yaml --out site/data

      - name: Copiar la interfaz
        run: cp -r web/. site/

      # Modo privado: el sitio queda como archivo descargable en la corrida (Actions → corrida → Artifacts)
      - uses: actions/upload-artifact@v7
        with:
          name: sitio
          path: site
          retention-days: 7

      # Publica en Pages salvo que la variable del repo PUBLISH = false
      - if: vars.PUBLISH != 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: vars.PUBLISH != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
